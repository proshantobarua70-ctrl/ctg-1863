
name: Import Catalog to D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctgmovies-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import full catalog into D1
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");

          const TOKEN = process.env.CLOUDFLARE_API_TOKEN;
          const ACCOUNT = process.env.CLOUDFLARE_ACCOUNT_ID;
          const DATABASE = process.env.CLOUDFLARE_D1_DATABASE_ID;

          if (!TOKEN || !ACCOUNT || !DATABASE) {
            throw new Error(
              "Missing Cloudflare secret. Check the existing secret names."
            );
          }

          const FILE = "data.json.gz";

          if (!fs.existsSync(FILE)) {
            throw new Error(`${FILE} not found in repository.`);
          }

          const raw = zlib.gunzipSync(fs.readFileSync(FILE)).toString("utf8");
          const parsed = JSON.parse(raw);
          const source = Array.isArray(parsed) ? parsed : parsed.items;

          if (!Array.isArray(source) || source.length === 0) {
            throw new Error("No catalog items found in data.json.gz.");
          }

          const items = source.filter(x => x && x.id != null);

          if (!items.length) {
            throw new Error("No items with IDs found.");
          }

          const columns = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url", "links"
          ];

          function literal(value) {
            if (value === undefined || value === null) return "NULL";

            if (typeof value === "number") {
              return Number.isFinite(value) ? String(value) : "NULL";
            }

            if (typeof value === "boolean") return value ? "1" : "0";

            const str = typeof value === "string"
              ? value
              : JSON.stringify(value);

            return "'" + str.replace(/'/g, "''") + "'";
          }

          function makeStatement(rows) {
            const values = rows.map(item => {
              const row = columns.map(col => literal(item[col]));
              row.push("CURRENT_TIMESTAMP");
              return "(" + row.join(",") + ")";
            });

            const insertColumns = [...columns, "updated_at"];

            const updates = columns
              .filter(col => col !== "id")
              .map(col => `"${col}"=excluded."${col}"`);

            updates.push('"updated_at"=CURRENT_TIMESTAMP');

            return `INSERT INTO movies (${insertColumns.map(c => `"${c}"`).join(",")})
          VALUES ${values.join(",")}
          ON CONFLICT(id) DO UPDATE SET ${updates.join(",")}`;
          }

          async function query(sql) {
            const url =
              `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}` +
              `/d1/database/${DATABASE}/query`;

            let lastError;

            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const response = await fetch(url, {
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${TOKEN}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ sql })
                });

                const text = await response.text();
                let data;

                try {
                  data = JSON.parse(text);
                } catch {
                  throw new Error(
                    `Cloudflare returned invalid JSON: ${text.slice(0, 300)}`
                  );
                }

                if (!response.ok || data.success !== true) {
                  throw new Error(
                    `HTTP ${response.status}: ` +
                    JSON.stringify(data.errors || data).slice(0, 800)
                  );
                }

                return data;
              } catch (error) {
                lastError = error;

                if (attempt === 5) break;

                const delay = Math.min(1000 * (2 ** (attempt - 1)), 10000);
                console.log(
                  `Retry ${attempt}/5 after error: ${error.message}`
                );
                await new Promise(resolve => setTimeout(resolve, delay));
              }
            }

            throw lastError;
          }

          async function main() {
            console.log(`SOURCE ITEMS: ${source.length}`);
            console.log(`ITEMS WITH IDs: ${items.length}`);
            console.log("Preparing size-limited SQL batches...");

            const MAX_ROWS = 40;
            const MAX_SQL_BYTES = 300000;
            const batches = [];
            let current = [];

            for (const item of items) {
              const candidate = [...current, item];
              const sql = makeStatement(candidate);
              const bytes = Buffer.byteLength(sql, "utf8");

              if (
                current.length > 0 &&
                (candidate.length > MAX_ROWS || bytes > MAX_SQL_BYTES)
              ) {
                batches.push(current);
                current = [item];
              } else {
                current = candidate;
              }

              if (Buffer.byteLength(makeStatement(current), "utf8") > MAX_SQL_BYTES) {
                throw new Error(
                  `One item is too large for a safe SQL batch: ${item.id}`
                );
              }
            }

            if (current.length) batches.push(current);

            const total = items.length;
            const totalBatches = batches.length;
            let next = 0;
            let completed = 0;
            let failed = null;

            console.log(`TOTAL BATCHES: ${totalBatches}`);
            console.log(`TOTAL ITEMS: ${total}`);
            console.log("Starting import...");

            async function worker() {
              while (!failed) {
                const index = next++;
                if (index >= batches.length) return;

                const batch = batches[index];

                try {
                  await query(makeStatement(batch));
                  completed += batch.length;

                  console.log(
                    `PROGRESS: ${completed}/${total} | ` +
                    `remaining: ${total - completed} | ` +
                    `batch: ${index + 1}/${totalBatches}`
                  );
                } catch (error) {
                  failed = new Error(
                    `Batch ${index + 1}/${totalBatches} failed: ${error.message}`
                  );
                  throw failed;
                }
              }
            }

            const results = await Promise.allSettled(
              Array.from({ length: 3 }, () => worker())
            );

            const rejected = results.find(r => r.status === "rejected");

            if (rejected) throw rejected.reason;

            const verification = await query(
              "SELECT COUNT(*) AS count FROM movies"
            );

            const count = verification.result?.[0]?.results?.[0]?.count;

            console.log(`SOURCE ITEMS: ${total}`);
            console.log(`ITEMS SUBMITTED SUCCESSFULLY: ${completed}`);
            console.log(`D1 UNIQUE ROW COUNT: ${count}`);
            console.log("IMPORT COMPLETE");
          }

          main().catch(error => {
            console.error("IMPORT FAILED:", error.stack || error.message);
            process.exit(1);
          });
          NODE
