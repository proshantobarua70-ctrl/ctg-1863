
name: Import Catalog to D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctgmovies-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import catalog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");

          const TOKEN = process.env.CLOUDFLARE_API_TOKEN;
          const ACCOUNT = process.env.CLOUDFLARE_ACCOUNT_ID;
          const DATABASE = process.env.D1_DATABASE_ID;

          if (!TOKEN || !ACCOUNT || !DATABASE) {
            throw new Error("Cloudflare secrets missing.");
          }

          if (!fs.existsSync("data.json.gz")) {
            throw new Error("data.json.gz not found.");
          }

          const parsed = JSON.parse(
            zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8")
          );

          const items = (Array.isArray(parsed) ? parsed : parsed.items)
            ?.filter(x => x && x.id != null);

          if (!items?.length) {
            throw new Error("No catalog items found.");
          }

          const columns = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url", "links"
          ];

          function val(v) {
            if (v == null) return null;
            if (typeof v === "object") return JSON.stringify(v);
            if (typeof v === "boolean") return v ? 1 : 0;
            return v;
          }

          function makeQuery(rows) {
            const insertCols = [...columns, "updated_at"];
            const placeholders = "(" +
              columns.map(() => "?").join(",") +
              ",CURRENT_TIMESTAMP)";

            const sql = `
              INSERT INTO movies (${insertCols.map(c => `"${c}"`).join(",")})
              VALUES ${rows.map(() => placeholders).join(",")}
              ON CONFLICT(id) DO UPDATE SET
              ${columns.filter(c => c !== "id")
                .map(c => `"${c}"=excluded."${c}"`).join(",")},
              "updated_at"=CURRENT_TIMESTAMP
            `;

            const params = [];
            for (const item of rows) {
              for (const col of columns) params.push(val(item[col]));
            }

            return { sql, params };
          }

          async function query(statement) {
            const url =
              `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}` +
              `/d1/database/${DATABASE}/query`;

            let lastError;

            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const response = await fetch(url, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${TOKEN}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(statement)
                });

                const body = await response.json();

                if (!response.ok || body.success !== true) {
                  throw new Error(
                    `HTTP ${response.status}: ` +
                    JSON.stringify(body.errors || body).slice(0, 900)
                  );
                }

                return body;
              } catch (error) {
                lastError = error;
                if (attempt === 5) break;

                const delay = Math.min(1000 * 2 ** (attempt - 1), 10000);
                console.log(`Retry ${attempt}/5: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, delay));
              }
            }

            throw lastError;
          }

          async function main() {
            console.log(`SOURCE ITEMS: ${items.length}`);

            const MAX_ROWS = 50;
            const MAX_BYTES = 700000;
            const batches = [];
            let current = [];

            for (const item of items) {
              const candidate = [...current, item];
              const size = Buffer.byteLength(
                JSON.stringify(makeQuery(candidate)), "utf8"
              );

              if (
                current.length &&
                (candidate.length > MAX_ROWS || size > MAX_BYTES)
              ) {
                batches.push(current);
                current = [item];
              } else {
                current = candidate;
              }

              const singleSize = Buffer.byteLength(
                JSON.stringify(makeQuery(current)), "utf8"
              );

              if (current.length === 1 && singleSize > MAX_BYTES) {
                console.log(
                  `LARGE RECORD: ${item.id}, ${singleSize} bytes; ` +
                  "sending intact as a single-record request."
                );
              }
            }

            if (current.length) batches.push(current);

            console.log(`TOTAL BATCHES: ${batches.length}`);
            console.log("PARALLEL WORKERS: 6");

            let next = 0;
            let completed = 0;
            let failure = null;

            async function worker() {
              while (!failure) {
                const index = next++;
                if (index >= batches.length) return;

                try {
                  await query(makeQuery(batches[index]));
                  completed += batches[index].length;

                  console.log(
                    `PROGRESS: ${completed}/${items.length} | ` +
                    `REMAINING: ${items.length - completed} | ` +
                    `BATCH: ${index + 1}/${batches.length}`
                  );
                } catch (error) {
                  failure = new Error(
                    `Batch ${index + 1} failed: ${error.message}`
                  );
                  throw failure;
                }
              }
            }

            const results = await Promise.allSettled(
              Array.from({ length: 6 }, () => worker())
            );

            const rejected = results.find(r => r.status === "rejected");
            if (rejected) throw rejected.reason;

            const check = await query({
              sql: "SELECT COUNT(*) AS count FROM movies",
              params: []
            });

            console.log(
              "D1 UNIQUE ROW COUNT:",
              check.result?.[0]?.results?.[0]?.count
            );
            console.log(`SOURCE ITEMS PROCESSED: ${completed}`);
            console.log("IMPORT COMPLETE");
          }

          main().catch(error => {
            console.error("IMPORT FAILED:", error.stack || error.message);
            process.exit(1);
          });
          NODE
