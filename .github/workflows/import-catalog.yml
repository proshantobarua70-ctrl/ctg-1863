
name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctg-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import catalog
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          cat > import.js <<'JS'
          const fs = require("fs");
          const zlib = require("zlib");

          const BATCH = 10;
          const PARALLEL = 3;

          async function main() {
            const { CF_TOKEN, CF_ACCOUNT, D1_ID } = process.env;

            if (!CF_TOKEN || !CF_ACCOUNT || !D1_ID) {
              throw new Error("Missing Cloudflare GitHub secrets");
            }

            if (!fs.existsSync("data.json.gz")) {
              throw new Error("data.json.gz not found at repository root");
            }

            console.log("Decompressing catalog...");
            const raw = zlib.gunzipSync(
              fs.readFileSync("data.json.gz")
            ).toString("utf8");

            const json = JSON.parse(raw);
            const items = Array.isArray(json) ? json : json.items;

            if (!Array.isArray(items) || !items.length) {
              throw new Error("Catalog is empty or invalid");
            }

            const endpoint =
              `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${D1_ID}/query`;

            async function query(sql, params = []) {
              for (let attempt = 0; attempt < 5; attempt++) {
                try {
                  const r = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                      Authorization: `Bearer ${CF_TOKEN}`,
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ sql, params })
                  });

                  const result = await r.json();

                  if (r.ok && result.success) return result;

                  const msg = JSON.stringify(result.errors || result);
                  if (r.status < 500 && r.status !== 429) {
                    throw new Error(msg);
                  }
                  console.log(`Retry ${attempt + 1}: ${msg}`);
                } catch (e) {
                  if (attempt === 4) throw e;
                  console.log(`Retry ${attempt + 1}: ${e.message}`);
                }

                await new Promise(resolve =>
                  setTimeout(resolve, 500 * (attempt + 1))
                );
              }
            }

            await query(`
              CREATE TABLE IF NOT EXISTS catalog (
                id TEXT PRIMARY KEY,
                kind TEXT NOT NULL,
                name TEXT,
                data TEXT NOT NULL
              )
            `);

            await query(
              "CREATE INDEX IF NOT EXISTS idx_catalog_kind ON catalog(kind)"
            );
            await query(
              "CREATE INDEX IF NOT EXISTS idx_catalog_name ON catalog(name)"
            );

            const batches = [];
            for (let i = 0; i < items.length; i += BATCH) {
              batches.push(items.slice(i, i + BATCH));
            }

            let next = 0;
            let completed = 0;
            let failed = 0;

            async function worker() {
              while (true) {
                const index = next++;
                if (index >= batches.length) return;

                const batch = batches[index];

                try {
                  const params = [];
                  const values = batch.map((item, offset) => {
                    const id = String(
                      item.id || item.slug || item.name || ""
                    ).trim();

                    if (!id) {
                      throw new Error(
                        `Missing ID in batch ${index + 1}, item ${offset + 1}`
                      );
                    }

                    const metadata = { ...item };
                    delete metadata.links;

                    if (Array.isArray(metadata.episodes)) {
                      metadata.episodes = metadata.episodes.map(ep => {
                        const clean = { ...ep };
                        delete clean.links;
                        delete clean.url;
                        delete clean.streamUrl;
                        return clean;
                      });
                    }

                    params.push(
                      id,
                      String(item.kind || "movie"),
                      String(item.name || ""),
                      JSON.stringify(metadata)
                    );

                    return "(?, ?, ?, ?)";
                  });

                  await query(`
                    INSERT INTO catalog (id, kind, name, data)
                    VALUES ${values.join(",")}
                    ON CONFLICT(id) DO UPDATE SET
                      kind = excluded.kind,
                      name = excluded.name,
                      data = excluded.data
                  `, params);

                  completed += batch.length;
                  if (completed % 100 === 0 || completed === items.length) {
                    console.log(`Progress: ${completed}/${items.length}`);
                  }
                } catch (e) {
                  failed += batch.length;
                  console.error(`Batch ${index + 1} failed: ${e.message}`);
                  throw e;
                }
              }
            }

            await Promise.all(
              Array.from({ length: PARALLEL }, () => worker())
            );

            console.log(
              `Import complete. Items processed: ${completed}; failed: ${failed}`
            );

            const check = await query(
              "SELECT COUNT(*) AS total FROM catalog"
            );
            console.log("D1 catalog count:", JSON.stringify(check.result));
          }

          main().catch(error => {
            console.error("IMPORT FAILED:", error.message);
            process.exit(1);
          });
          JS

          node import.js
