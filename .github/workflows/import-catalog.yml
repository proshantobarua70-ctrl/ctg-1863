
name: Import Catalog to D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctgmovies-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import all catalog records
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");

          const TOKEN = process.env.CLOUDFLARE_API_TOKEN;
          const ACCOUNT = process.env.CLOUDFLARE_ACCOUNT_ID;
          const DATABASE = process.env.D1_DATABASE_ID;

          if (!TOKEN || !ACCOUNT || !DATABASE) {
            throw new Error("Cloudflare secrets are missing.");
          }

          if (!fs.existsSync("data.json.gz")) {
            throw new Error("data.json.gz is missing.");
          }

          const parsed = JSON.parse(
            zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8")
          );

          const items = (Array.isArray(parsed) ? parsed : parsed.items)
            ?.filter(x => x && x.id != null);

          if (!items?.length) {
            throw new Error("No catalog records found.");
          }

          const columns = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url", "links"
          ];

          function value(v) {
            if (v === undefined || v === null) return null;
            if (typeof v === "object") return JSON.stringify(v);
            if (typeof v === "boolean") return v ? 1 : 0;
            return v;
          }

          function makeBatch(rows) {
            const oneRow = "(" +
              columns.map(() => "?").join(",") +
              ",CURRENT_TIMESTAMP)";

            const sql = `
              INSERT INTO movies (
                ${columns.map(c => `"${c}"`).join(",")}, "updated_at"
              )
              VALUES ${rows.map(() => oneRow).join(",")}
              ON CONFLICT(id) DO UPDATE SET
                ${columns.filter(c => c !== "id")
                  .map(c => `"${c}"=excluded."${c}"`).join(",")},
                "updated_at"=CURRENT_TIMESTAMP
            `;

            const params = [];
            for (const item of rows) {
              for (const col of columns) params.push(value(item[col]));
            }

            return { sql, params };
          }

          async function query(statement) {
            const url =
              `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}` +
              `/d1/database/${DATABASE}/query`;

            let lastError;

            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const res = await fetch(url, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${TOKEN}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(statement)
                });

                const body = await res.json();

                if (!res.ok || body.success !== true) {
                  throw new Error(
                    `HTTP ${res.status}: ` +
                    JSON.stringify(body.errors || body).slice(0, 1000)
                  );
                }

                return body;
              } catch (e) {
                lastError = e;

                if (attempt < 5) {
                  const delay = Math.min(1000 * 2 ** (attempt - 1), 10000);
                  console.log(`Retry ${attempt}/5: ${e.message}`);
                  await new Promise(r => setTimeout(r, delay));
                }
              }
            }

            throw lastError;
          }

          async function main() {
            console.log(`SOURCE ITEMS: ${items.length}`);

            // Keep under SQLite's usual 100 bound-parameter limit.
            const MAX_ROWS = 5;
            const MAX_BYTES = 700000;
            const batches = [];
            let current = [];

            for (const item of items) {
              const candidate = [...current, item];
              const request = makeBatch(candidate);
              const bytes = Buffer.byteLength(
                JSON.stringify(request), "utf8"
              );

              if (
                current.length > 0 &&
                (candidate.length > MAX_ROWS || bytes > MAX_BYTES)
              ) {
                batches.push(current);
                current = [item];
              } else {
                current = candidate;
              }

              // A large record is kept intact as a single-row request.
              if (current.length === 1) {
                const size = Buffer.byteLength(
                  JSON.stringify(makeBatch(current)), "utf8"
                );
                if (size > MAX_BYTES) {
                  console.log(
                    `LARGE ITEM: ${item.id} (${size} request bytes); ` +
                    "sending separately without truncating fields."
                  );
                }
              }
            }

            if (current.length) batches.push(current);

            console.log(`TOTAL BATCHES: ${batches.length}`);
            console.log("Starting import...");

            let next = 0;
            let completed = 0;
            let failed = null;

            async function worker() {
              while (!failed) {
                const index = next++;
                if (index >= batches.length) return;

                const rows = batches[index];

                try {
                  await query(makeBatch(rows));
                  completed += rows.length;

                  console.log(
                    `PROGRESS: ${completed}/${items.length} | ` +
                    `REMAINING: ${items.length - completed} | ` +
                    `BATCH: ${index + 1}/${batches.length}`
                  );
                } catch (e) {
                  failed = new Error(
                    `Batch ${index + 1}/${batches.length} failed: ${e.message}`
                  );
                  throw failed;
                }
              }
            }

            const results = await Promise.allSettled(
              Array.from({ length: 4 }, () => worker())
            );

            const rejected = results.find(r => r.status === "rejected");
            if (rejected) throw rejected.reason;

            const check = await query({
              sql: "SELECT COUNT(*) AS count FROM movies",
              params: []
            });

            console.log(
              "D1 UNIQUE ROW COUNT:",
              check.result?.[0]?.results?.[0]?.count
            );
            console.log(`SOURCE ITEMS IMPORTED: ${completed}`);
            console.log("IMPORT COMPLETE");
          }

          main().catch(e => {
            console.error("IMPORT FAILED:", e.stack || e.message);
            process.exit(1);
          });
          NODE
