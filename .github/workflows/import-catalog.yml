name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalog
        shell: bash
        run: |
          set -euo pipefail
          test -s data.json.gz
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$D1_DATABASE_ID"

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");
          const data = JSON.parse(zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8"));
          const items = Array.isArray(data) ? data : data.items;
          if (!Array.isArray(items) || !items.length) throw Error("Catalog empty");
          if (!items.some(x => x && x.id)) throw Error("No IDs found");
          console.log("Catalog records:", items.length);
          NODE

          cat > wrangler.toml <<EOF
          name = "ctgmovies-d1-import"
          compatibility_date = "2026-10-12"

          [[d1_databases]]
          binding = "DB"
          database_name = "ctgmovies"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Create D1 table
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute ctgmovies --remote --command="CREATE TABLE IF NOT EXISTS movies (id TEXT PRIMARY KEY, kind TEXT, slug TEXT, name TEXT, poster TEXT, backdrop TEXT, year INTEGER, overview TEXT, rating REAL, genres TEXT, runtime INTEGER, imdb TEXT, tmdb TEXT, trailer TEXT, episodes TEXT, detail_url TEXT, links TEXT, updated_at TEXT);"

      - name: Prepare SQL batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-import

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");
          const data = JSON.parse(zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8"));
          const items = (Array.isArray(data) ? data : data.items).filter(x => x && x.id);

          const cols = ["id","kind","slug","name","poster","backdrop","year","overview","rating","genres","runtime","imdb","tmdb","trailer","episodes","detail_url","links","updated_at"];
          const MAX_FIELD_CHARS = 6000;
          const MAX_STATEMENTS = 100;
          const MAX_FILE_BYTES = 250 * 1024;
          const now = new Date().toISOString();

          function raw(v) {
            if (v === undefined || v === null || v === "") return null;
            if (typeof v === "object") return JSON.stringify(v);
            return String(v);
          }

          function quote(s) {
            return "'" + s.replace(/'/g, "''") + "'";
          }

          function val(v) {
            if (v === undefined || v === null || v === "") return "NULL";
            if (typeof v === "number" && Number.isFinite(v)) return String(v);
            if (typeof v === "boolean") return v ? "1" : "0";
            return quote(raw(v));
          }

          let statements = [];
          let bytes = 0;
          let part = 0;
          let largeFields = 0;

          function flush() {
            if (!statements.length) return;
            const file = "/tmp/d1-import/chunk-" + String(++part).padStart(5, "0") + ".sql";
            fs.writeFileSync(file, statements.join("\n") + "\n");
            statements = [];
            bytes = 0;
          }

          function add(sql) {
            const size = Buffer.byteLength(sql, "utf8") + 1;
            if (size > 20000) throw Error("SQL statement too large: " + size);
            if (statements.length &&
                (statements.length >= MAX_STATEMENTS || bytes + size > MAX_FILE_BYTES)) {
              flush();
            }
            statements.push(sql);
            bytes += size;
          }

          for (const x of items) {
            const detail = x.detail_url ||
              (x.kind && x.slug ? "https://ctgmovies.com/" + x.kind + "/" + x.slug : null);

            const values = [
              x.id,x.kind,x.slug,x.name,x.poster,x.backdrop,x.year,x.overview,
              x.rating,x.genres,x.runtime,x.imdb,x.tmdb,x.trailer,x.episodes,
              detail,x.links,now
            ];

            const stored = [];
            const updates = [];

            for (let i = 0; i < cols.length; i++) {
              const original = values[i];
              const s = raw(original);

              if (s !== null &&
                  typeof original !== "number" &&
                  typeof original !== "boolean" &&
                  s.length > MAX_FIELD_CHARS) {
                stored.push("NULL");
                largeFields++;

                for (let pos = 0; pos < s.length; pos += MAX_FIELD_CHARS) {
                  const piece = s.slice(pos, pos + MAX_FIELD_CHARS);
                  updates.push(
                    "UPDATE movies SET " + cols[i] +
                    " = COALESCE(" + cols[i] + ",'') || " +
                    quote(piece) + " WHERE id = " + val(x.id) + ";"
                  );
                }
              } else {
                stored.push(val(original));
              }
            }

            add("INSERT OR REPLACE INTO movies (" + cols.join(",") +
                ") VALUES (" + stored.join(",") + ");");

            for (const sql of updates) add(sql);
          }

          flush();
          console.log("Records:", items.length);
          console.log("SQL batches:", part);
          console.log("Large fields chunked:", largeFields);
          NODE

      - name: Import catalog into D1
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/d1-import/chunk-*.sql; do
            echo "Importing $file"
            npx --yes wrangler@4 d1 execute ctgmovies --remote --file="$file"
          done

      - name: Verify imported records
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute ctgmovies --remote --command="SELECT COUNT(*) AS total_records FROM movies;"
