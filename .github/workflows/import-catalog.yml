
name: Import Catalog to D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctgmovies-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import catalog
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");

          const TOKEN = process.env.CLOUDFLARE_API_TOKEN;
          const ACCOUNT = process.env.CLOUDFLARE_ACCOUNT_ID;
          const DATABASE = process.env.D1_DATABASE_ID;

          if (!TOKEN || !ACCOUNT || !DATABASE) {
            throw new Error(
              "Missing secret: check CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and D1_DATABASE_ID."
            );
          }

          if (!fs.existsSync("data.json.gz")) {
            throw new Error("data.json.gz not found in repository.");
          }

          const parsed = JSON.parse(
            zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8")
          );

          const items = (Array.isArray(parsed) ? parsed : parsed.items)
            ?.filter(x => x && x.id != null);

          if (!items?.length) {
            throw new Error("No catalog items with IDs found.");
          }

          const columns = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url", "links"
          ];

          function sqlValue(v) {
            if (v === undefined || v === null) return "NULL";
            if (typeof v === "boolean") return v ? "1" : "0";
            if (typeof v === "number") {
              return Number.isFinite(v) ? String(v) : "NULL";
            }
            const s = typeof v === "string" ? v : JSON.stringify(v);
            return "'" + s.replace(/'/g, "''") + "'";
          }

          function makeSQL(batch) {
            const cols = [...columns, "updated_at"];
            const values = batch.map(item => {
              const vals = columns.map(c => sqlValue(item[c]));
              vals.push("CURRENT_TIMESTAMP");
              return "(" + vals.join(",") + ")";
            });

            const updates = columns
              .filter(c => c !== "id")
              .map(c => `"${c}"=excluded."${c}"`);
            updates.push('"updated_at"=CURRENT_TIMESTAMP');

            return `INSERT INTO movies (${cols.map(c => `"${c}"`).join(",")})
          VALUES ${values.join(",")}
          ON CONFLICT(id) DO UPDATE SET ${updates.join(",")}`;
          }

          async function query(sql) {
            const url =
              `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}` +
              `/d1/database/${DATABASE}/query`;

            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const res = await fetch(url, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${TOKEN}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ sql })
                });

                const body = await res.json();

                if (!res.ok || body.success !== true) {
                  throw new Error(
                    `HTTP ${res.status}: ${JSON.stringify(body.errors || body).slice(0, 700)}`
                  );
                }

                return body;
              } catch (e) {
                if (attempt === 5) throw e;
                console.log(`Retry ${attempt}/5: ${e.message}`);
                await new Promise(r => setTimeout(r, attempt * 1500));
              }
            }
          }

          async function main() {
            console.log(`SOURCE ITEMS: ${items.length}`);

            const batches = [];
            let batch = [];

            for (const item of items) {
              batch.push(item);

              if (
                batch.length >= 20 ||
                Buffer.byteLength(makeSQL(batch), "utf8") > 150000
              ) {
                if (batch.length > 1 &&
                    Buffer.byteLength(makeSQL(batch), "utf8") > 150000) {
                  const last = batch.pop();
                  batches.push(batch);
                  batch = [last];
                } else {
                  batches.push(batch);
                  batch = [];
                }
              }

              if (Buffer.byteLength(makeSQL(batch), "utf8") > 150000) {
                throw new Error(`Single item too large: ${item.id}`);
              }
            }

            if (batch.length) batches.push(batch);

            console.log(`TOTAL BATCHES: ${batches.length}`);

            let next = 0;
            let completed = 0;
            let failed = null;

            async function worker() {
              while (!failed) {
                const index = next++;
                if (index >= batches.length) return;

                try {
                  await query(makeSQL(batches[index]));
                  completed += batches[index].length;

                  console.log(
                    `PROGRESS: ${completed}/${items.length} | ` +
                    `REMAINING: ${items.length - completed}`
                  );
                } catch (e) {
                  failed = new Error(
                    `Batch ${index + 1} failed: ${e.message}`
                  );
                  throw failed;
                }
              }
            }

            const results = await Promise.allSettled(
              Array.from({ length: 3 }, () => worker())
            );

            const rejected = results.find(x => x.status === "rejected");
            if (rejected) throw rejected.reason;

            const result = await query(
              "SELECT COUNT(*) AS count FROM movies"
            );

            console.log(
              "D1 UNIQUE ROW COUNT:",
              result.result?.[0]?.results?.[0]?.count
            );
            console.log("IMPORT COMPLETE");
          }

          main().catch(e => {
            console.error("IMPORT FAILED:", e.stack || e.message);
            process.exit(1);
          });
          NODE
