
name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctg-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import catalog and preserve stream links
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          cat > import.js <<'JS'
          const fs = require("fs");
          const zlib = require("zlib");

          async function main() {
            const { CF_TOKEN, CF_ACCOUNT, D1_ID } = process.env;
            if (!CF_TOKEN || !CF_ACCOUNT || !D1_ID) {
              throw new Error("Cloudflare secrets missing");
            }

            const raw = zlib.gunzipSync(
              fs.readFileSync("data.json.gz")
            ).toString("utf8");

            const parsed = JSON.parse(raw);
            const items = Array.isArray(parsed) ? parsed : parsed.items;

            if (!Array.isArray(items) || !items.length) {
              throw new Error("Catalog empty; import stopped");
            }

            const endpoint =
              `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${D1_ID}/query`;

            async function query(sql, params = []) {
              const r = await fetch(endpoint, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${CF_TOKEN}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ sql, params })
              });

              const result = await r.json();
              if (!r.ok || !result.success) {
                throw new Error(JSON.stringify(result.errors || result));
              }
              return result;
            }

            await query(`
              CREATE TABLE IF NOT EXISTS catalog (
                id TEXT PRIMARY KEY,
                kind TEXT NOT NULL,
                name TEXT,
                data TEXT NOT NULL
              )
            `);

            const batchSize = 10;
            let done = 0;

            for (let i = 0; i < items.length; i += batchSize) {
              const batch = items.slice(i, i + batchSize);
              const params = [];
              const values = batch.map(item => {
                const id = String(item.id || item.slug || item.name || "").trim();
                if (!id) throw new Error("Catalog item missing ID");

                // Preserve movie links and episode links.
                params.push(
                  id,
                  String(item.kind || "movie"),
                  String(item.name || ""),
                  JSON.stringify(item)
                );
                return "(?, ?, ?, ?)";
              });

              await query(`
                INSERT INTO catalog (id, kind, name, data)
                VALUES ${values.join(",")}
                ON CONFLICT(id) DO UPDATE SET
                  kind = excluded.kind,
                  name = excluded.name,
                  data = excluded.data
              `, params);

              done += batch.length;
              console.log(`Imported ${done}/${items.length}`);
            }

            console.log("Import complete:", done);
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          JS

          node import.js
