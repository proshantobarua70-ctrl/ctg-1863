```yaml
name: Cloudflare Catalog Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctg-cloudflare-test
  cancel-in-progress: false

jobs:
  test-cloudflare:
    name: Verify Worker and Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare Worker
        run: |
          set -euo pipefail

          BASE_URL="https://ctgmovies-api.proshantobarua70-4a5.workers.dev"

          echo "Checking Worker health..."
          curl --fail --silent --show-error \
            --max-time 20 \
            "$BASE_URL/ping"

          echo ""
          echo "Checking D1 record count..."
          DB_RESPONSE=$(curl --fail --silent --show-error \
            --max-time 20 \
            "$BASE_URL/db")

          echo "$DB_RESPONSE"

          COUNT=$(node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const d = JSON.parse(s);
              if (d.ok !== true || !Number.isFinite(d.count)) {
                console.error("Invalid database response");
                process.exit(1);
              }
              console.log(d.count);
            });
          ' <<< "$DB_RESPONSE")

          echo "Database records: $COUNT"

      - name: Check catalog API
        run: |
          set -euo pipefail

          URL="https://ctgmovies-api.proshantobarua70-4a5.workers.dev/movies?page=1"

          RESPONSE=$(curl --fail --silent --show-error \
            --max-time 30 "$URL")

          echo "$RESPONSE" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const d = JSON.parse(s);

              if (d.ok !== true || !Array.isArray(d.items)) {
                console.error("Unexpected catalog response");
                process.exit(1);
              }

              console.log("Catalog API: OK");
              console.log("Page:", d.page);
              console.log("Records returned:", d.items.length);
            });
          '

      - name: Summary
        if: success()
        run: |
          echo "Cloudflare Worker and catalog API checks passed."
```
