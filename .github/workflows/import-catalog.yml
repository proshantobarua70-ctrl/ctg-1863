name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate
        run: |
          set -euo pipefail
          test -s data.json.gz
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$D1_DATABASE_ID"

      - name: Create table
        run: |
          npx --yes wrangler@4 d1 execute ctgmovies --remote \
          --command="CREATE TABLE IF NOT EXISTS movies (id TEXT PRIMARY KEY, kind TEXT, slug TEXT, name TEXT, poster TEXT, backdrop TEXT, year INTEGER, overview TEXT, rating REAL, genres TEXT, runtime INTEGER, imdb TEXT, tmdb TEXT, trailer TEXT, episodes TEXT, detail_url TEXT, links TEXT, updated_at TEXT);"

      - name: Build batches
        run: |
          mkdir -p /tmp/sql
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const d = JSON.parse(zlib.gunzipSync(fs.readFileSync('data.json.gz')));
          const items = (Array.isArray(d) ? d : d.items).filter(x => x && x.id);
          const cols = ['id','kind','slug','name','poster','backdrop','year','overview','rating','genres','runtime','imdb','tmdb','trailer','episodes','detail_url','links','updated_at'];
          const MAX = 500 * 1024, FIELD = 6000;
          let lines = [], bytes = 0, part = 0;
          const now = new Date().toISOString();

          const raw = v => v == null || v === '' ? null :
            (typeof v === 'object' ? JSON.stringify(v) : String(v));
          const q = s => "'" + s.replace(/'/g, "''") + "'";
          const val = v => {
            if (v == null || v === '') return 'NULL';
            if (typeof v === 'number' && Number.isFinite(v)) return String(v);
            if (typeof v === 'boolean') return v ? '1' : '0';
            return q(raw(v));
          };
          function flush() {
            if (!lines.length) return;
            fs.writeFileSync('/tmp/sql/batch-' + String(++part).padStart(5,'0') + '.sql', lines.join('\n') + '\n');
            lines = []; bytes = 0;
          }
          function add(s) {
            const n = Buffer.byteLength(s) + 1;
            if (n > MAX) throw Error('SQL statement exceeds batch limit: ' + n);
            if (bytes + n > MAX) flush();
            lines.push(s); bytes += n;
          }

          for (const x of items) {
            const detail = x.detail_url || (x.kind && x.slug ? 'https://ctgmovies.com/' + x.kind + '/' + x.slug : null);
            const vals = [x.id,x.kind,x.slug,x.name,x.poster,x.backdrop,x.year,x.overview,x.rating,x.genres,x.runtime,x.imdb,x.tmdb,x.trailer,x.episodes,detail,x.links,now];
            const stored = [], updates = [];
            for (let i = 0; i < cols.length; i++) {
              const v = vals[i], s = raw(v);
              if (s !== null && typeof v !== 'number' && typeof v !== 'boolean' && s.length > FIELD) {
                stored.push('NULL');
                for (let p = 0; p < s.length; p += FIELD) {
                  updates.push('UPDATE movies SET ' + cols[i] + " = COALESCE(" + cols[i] + ",'') || " + q(s.slice(p,p+FIELD)) + ' WHERE id = ' + val(x.id) + ';');
                }
              } else stored.push(val(v));
            }
            add('INSERT OR REPLACE INTO movies (' + cols.join(',') + ') VALUES (' + stored.join(',') + ');');
            for (const u of updates) add(u);
          }
          flush();
          console.log('Records:', items.length, 'SQL batches:', part);
          NODE

      - name: Import batches
        run: |
          set -euo pipefail
          for file in /tmp/sql/batch-*.sql; do
            echo "Importing $file"
            npx --yes wrangler@4 d1 execute ctgmovies --remote --file="$file"
          done

      - name: Verify
        run: |
          npx --yes wrangler@4 d1 execute ctgmovies --remote \
          --command="SELECT COUNT(*) AS total_records FROM movies;"
