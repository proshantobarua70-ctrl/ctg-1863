name: Import Catalog to D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctgmovies-d1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check catalog file
        shell: bash
        run: |
          set -euo pipefail
          test -s data.json.gz
          SIZE=$(stat -c%s data.json.gz)
          echo "Catalog file size: $SIZE bytes"
          test "$SIZE" -ge 100

      - name: Check import script
        shell: bash
        run: |
          set -euo pipefail
          test -s import-to-d1.js || {
            echo "::error::import-to-d1.js not found in repository root"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import catalog to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          node import-to-d1.js
