name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalog and credentials
        shell: bash
        run: |
          set -euo pipefail

          test -s data.json.gz
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$D1_DATABASE_ID"

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");

          const raw = zlib.gunzipSync(
            fs.readFileSync("data.json.gz")
          ).toString("utf8");

          const data = JSON.parse(raw);
          const items = Array.isArray(data) ? data : data.items;

          if (!Array.isArray(items) || !items.length) {
            throw new Error("Catalog is empty or invalid");
          }

          if (!items.some(x => x && x.id)) {
            throw new Error("No item IDs found");
          }

          console.log("Catalog items:", items.length);
          NODE

          cat > wrangler.toml <<EOF
          name = "ctgmovies-d1-import"
          compatibility_date = "2026-10-12"

          [[d1_databases]]
          binding = "DB"
          database_name = "ctgmovies"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Create D1 table
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4 d1 execute ctgmovies --remote --command="CREATE TABLE IF NOT EXISTS movies (
            id TEXT PRIMARY KEY,
            kind TEXT,
            slug TEXT,
            name TEXT,
            poster TEXT,
            backdrop TEXT,
            year INTEGER,
            overview TEXT,
            rating REAL,
            genres TEXT,
            runtime INTEGER,
            imdb TEXT,
            tmdb TEXT,
            trailer TEXT,
            episodes TEXT,
            detail_url TEXT,
            links TEXT,
            updated_at TEXT
          );"

      - name: Prepare small SQL batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-import

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");
          const path = "/tmp/d1-import";

          const data = JSON.parse(
            zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8")
          );

          const items = Array.isArray(data) ? data : data.items;

          function val(v) {
            if (v === undefined || v === null || v === "") return "NULL";
            if (typeof v === "number" && Number.isFinite(v)) {
              return String(v);
            }
            if (typeof v === "boolean") return v ? "1" : "0";

            const s = typeof v === "object"
              ? JSON.stringify(v)
              : String(v);

            return "'" + s.replace(/'/g, "''") + "'";
          }

          const cols = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url",
            "links", "updated_at"
          ];

          const valid = items.filter(x => x && x.id);
          const now = new Date().toISOString();

          const MAX_RECORDS = 10;
          const MAX_SQL_BYTES = 64 * 1024;

          let batch = [];
          let bytes = 0;
          let part = 0;
          let skipped = 0;

          function flush() {
            if (!batch.length) return;

            part++;

            const file = path + "/chunk-" +
              String(part).padStart(5, "0") + ".sql";

            fs.writeFileSync(file, batch.join("\n") + "\n");
            batch = [];
            bytes = 0;
          }

          for (const x of valid) {
            const detail = x.detail_url ||
              (x.kind && x.slug
                ? "https://ctgmovies.com/" + x.kind + "/" + x.slug
                : null);

            const values = [
              x.id, x.kind, x.slug, x.name, x.poster, x.backdrop,
              x.year, x.overview, x.rating, x.genres, x.runtime,
              x.imdb, x.tmdb, x.trailer, x.episodes, detail,
              x.links, now
            ];

            const sql = "INSERT OR REPLACE INTO movies (" +
              cols.join(",") + ") VALUES (" +
              values.map(val).join(",") + ");";

            const size = Buffer.byteLength(sql, "utf8") + 1;

            if (size > MAX_SQL_BYTES) {
              console.error("Skipping oversized record:", String(x.id));
              skipped++;
              continue;
            }

            if (
              batch.length >= MAX_RECORDS ||
              bytes + size > MAX_SQL_BYTES
            ) {
              flush();
            }

            batch.push(sql);
            bytes += size;
          }

          flush();

          console.log("Valid records:", valid.length);
          console.log("SQL batches:", part);
          console.log("Skipped oversized records:", skipped);

          if (part === 0) {
            throw new Error("No SQL batches generated");
          }
          NODE

      - name: Import catalog into D1
        shell: bash
        run: |
          set -euo pipefail

          for file in /tmp/d1-import/chunk-*.sql; do
            echo "Importing $file"
            npx --yes wrangler@4 d1 execute ctgmovies --remote --file="$file"
          done

      - name: Verify imported records
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4 d1 execute ctgmovies --remote --command="SELECT COUNT(*) AS total_records FROM movies;"

          echo "Import workflow completed."
