```yaml
name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source and credentials
        shell: bash
        run: |
          set -euo pipefail

          test -s data.json.gz
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$D1_DATABASE_ID"

          node -e "const z=require('zlib'),f=require('fs');const d=JSON.parse(z.gunzipSync(f.readFileSync('data.json.gz')));const a=Array.isArray(d)?d:d.items;if(!Array.isArray(a)||!a.length)throw Error('Catalog is empty');console.log('GZIP valid; catalog records:',a.length)"

          cat > wrangler.toml <<EOF
          name = "ctgmovies-d1-import"
          compatibility_date = "2026-10-12"

          [[d1_databases]]
          binding = "DB"
          database_name = "ctgmovies"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Create D1 table
        shell: bash
        run: |
          set -euo pipefail

          npx --yes wrangler@4 d1 execute ctgmovies \
            --remote \
            --command="CREATE TABLE IF NOT EXISTS movies (
              id TEXT PRIMARY KEY,
              kind TEXT,
              slug TEXT,
              name TEXT,
              poster TEXT,
              backdrop TEXT,
              year INTEGER,
              overview TEXT,
              rating REAL,
              genres TEXT,
              runtime INTEGER,
              imdb TEXT,
              tmdb TEXT,
              trailer TEXT,
              episodes TEXT,
              detail_url TEXT,
              links TEXT,
              updated_at TEXT
            );"

      - name: Prepare SQL import batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-import

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");

          const raw = zlib.gunzipSync(
            fs.readFileSync("data.json.gz")
          ).toString("utf8");

          const data = JSON.parse(raw);
          const items = Array.isArray(data) ? data : data.items;

          if (!Array.isArray(items) || !items.length) {
            throw new Error("No catalog items found");
          }

          function val(v) {
            if (v === undefined || v === null || v === "") return "NULL";
            if (typeof v === "number" && Number.isFinite(v)) return String(v);
            if (typeof v === "boolean") return v ? "1" : "0";
            const s = typeof v === "object" ? JSON.stringify(v) : String(v);
            return "'" + s.replace(/'/g, "''") + "'";
          }

          const columns = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url",
            "links", "updated_at"
          ];

          const now = new Date().toISOString();
          const valid = items.filter(x => x && x.id);

          if (!valid.length) throw new Error("No records with id");

          let batch = [];
          let fileNo = 0;

          function flush() {
            if (!batch.length) return;
            fileNo++;
            fs.writeFileSync(
              "/tmp/d1-import/chunk-" +
                String(fileNo).padStart(4, "0") + ".sql",
              batch.join("\n") + "\n"
            );
            batch = [];
          }

          for (const item of valid) {
            const detailUrl = item.detail_url ||
              (item.kind && item.slug
                ? "https://ctgmovies.com/" + item.kind + "/" + item.slug
                : null);

            const values = [
              item.id, item.kind, item.slug, item.name,
              item.poster, item.backdrop, item.year, item.overview,
              item.rating, item.genres, item.runtime, item.imdb,
              item.tmdb, item.trailer, item.episodes, detailUrl,
              item.links, now
            ];

            batch.push(
              "INSERT OR REPLACE INTO movies (" +
              columns.join(", ") + ") VALUES (" +
              values.map(val).join(", ") + ");"
            );

            if (batch.length >= 100) flush();
          }

          flush();
          console.log("Valid records:", valid.length);
          console.log("SQL batches:", fileNo);
          NODE

      - name: Import catalog into D1
        shell: bash
        run: |
          set -euo pipefail

          for file in /tmp/d1-import/chunk-*.sql; do
            echo "Importing $file"
            npx --yes wrangler@4 d1 execute ctgmovies \
              --remote --file="$file"
          done

          echo "Catalog import completed."

      - name: Verify imported records
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute ctgmovies \
            --remote \
            --command="SELECT COUNT(*) AS total_records FROM movies;"
```
