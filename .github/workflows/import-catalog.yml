
      - name: Import lanes in parallel
        shell: bash
        env:
          TOTAL: ${{ steps.catalog.outputs.total }}
        run: |
          set -euo pipefail

          ROOT=/tmp/d1-import
          TOTAL_BATCHES=$(find "$ROOT" -type f -name 'batch-*.sql' | wc -l)
          echo "Total catalog records: ${TOTAL:-unknown}"
          echo "Total SQL batches: $TOTAL_BATCHES"

          export TOTAL_BATCHES
          export TOTAL
          export DONE_FILE="$RUNNER_TEMP/import-done"
          touch "$DONE_FILE"
          export PROGRESS_LOCK="$RUNNER_TEMP/progress-lock"

          run_lane() {
            local lane="$1"
            local file attempt
            for file in "$lane"/batch-*.sql; do
              [ -f "$file" ] || continue
              attempt=1
              until npx --yes wrangler@4 d1 execute ctgmovies \
                --remote --file="$file" >"$RUNNER_TEMP/wrangler.log" 2>&1; do
                cat "$RUNNER_TEMP/wrangler.log"
                if [ "$attempt" -ge 4 ]; then
                  echo "::error::Failed after 4 attempts: $(basename "$file")"
                  return 1
                fi
                echo "Retry $attempt/3: $(basename "$file")"
                sleep $((attempt * 2))
                attempt=$((attempt + 1))
              done

              # Count only completed batches; never print Wrangler's noisy JSON.
              flock "$PROGRESS_LOCK" bash -c '
                echo x >> "$DONE_FILE"
                done=$(wc -l < "$DONE_FILE")
                echo "Progress: $done/$TOTAL_BATCHES batches completed"
              '
            done
          }

          export -f run_lane
          find "$ROOT" -mindepth 1 -maxdepth 1 -type d -name 'lane-*' \
            -print0 | xargs -0 -r -n1 -P4 bash -c 'run_lane "$1"' _

          echo "All batches completed."
          npx --yes wrangler@4 d1 execute ctgmovies --remote \
            --command="SELECT COUNT(*) AS total_records FROM movies;"
