
name: Import Catalog to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -s data.json.gz || {
            echo "ERROR: data.json.gz missing or empty"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$D1_DATABASE_ID"

          node -e "require('zlib').gunzipSync(require('fs').readFileSync('data.json.gz')); console.log('GZIP file valid')"

          cat > wrangler.toml <<EOF
          name = "ctgmovies-d1-import"
          compatibility_date = "2026-10-12"

          [[d1_databases]]
          binding = "DB"
          database_name = "ctgmovies"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Prepare SQL import batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-import

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");

          const raw = zlib.gunzipSync(
            fs.readFileSync("data.json.gz")
          ).toString("utf8");

          const data = JSON.parse(raw);
          const items = Array.isArray(data) ? data : data.items;

          if (!Array.isArray(items) || items.length === 0) {
            throw new Error("No catalog items found in data.json.gz");
          }

          function q(s) {
            return "'" + String(s).replace(/'/g, "''") + "'";
          }

          function val(v) {
            if (v === undefined || v === null || v === "") return "NULL";
            if (typeof v === "number" && Number.isFinite(v)) return String(v);
            if (typeof v === "boolean") return v ? "1" : "0";
            if (typeof v === "object") return q(JSON.stringify(v));
            return q(v);
          }

          const columns = [
            "id", "kind", "slug", "name", "poster", "backdrop",
            "year", "overview", "rating", "genres", "runtime",
            "imdb", "tmdb", "trailer", "episodes", "detail_url",
            "links", "updated_at"
          ];

          const now = new Date().toISOString();
          const valid = items.filter(x => x && x.id);

          if (!valid.length) throw new Error("No records with an id");

          let batch = [];
          let fileNo = 0;

          function flush() {
            if (!batch.length) return;
            fileNo++;
            const filename =
              "/tmp/d1-import/chunk-" +
              String(fileNo).padStart(4, "0") + ".sql";

            fs.writeFileSync(filename, batch.join("\n") + "\n");
            batch = [];
          }

          for (const item of valid) {
            const detailUrl = item.detail_url ||
              (item.kind && item.slug
                ? "https://ctgmovies.com/" + item.kind + "/" + item.slug
                : null);

            const values = [
              item.id,
              item.kind,
              item.slug,
              item.name,
              item.poster,
              item.backdrop,
              item.year,
              item.overview,
              item.rating,
              item.genres,
              item.runtime,
              item.imdb,
              item.tmdb,
              item.trailer,
              item.episodes,
              detailUrl,
              item.links,
              now
            ];

            batch.push(
              "INSERT OR REPLACE INTO movies (" +
              columns.join(", ") +
              ") VALUES (" + values.map(val).join(", ") + ");"
            );

            if (batch.length >= 100) flush();
          }

          flush();
          console.log("Valid records:", valid.length);
          console.log("SQL batches:", fileNo);
          NODE

      - name: Import into Cloudflare D1
        shell: bash
        run: |
          set -euo pipefail

          for file in /tmp/d1-import/chunk-*.sql; do
            echo "Importing $file"
            npx --yes wrangler@4 d1 execute ctgmovies \
              --remote --file="$file"
          done

          echo "All SQL batches completed."
