      - name: Build fast SQL batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-import

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");

          const data = JSON.parse(
            zlib.gunzipSync(fs.readFileSync("data.json.gz")).toString("utf8")
          );
          const items = (Array.isArray(data) ? data : data.items)
            .filter(x => x && x.id);

          const cols = [
            "id","kind","slug","name","poster","backdrop","year",
            "overview","rating","genres","runtime","imdb","tmdb",
            "trailer","episodes","detail_url","links","updated_at"
          ];

          const MAX_FIELD_CHARS = 8000;
          const MAX_ROWS = 100;
          const MAX_FILE_BYTES = 250 * 1024;
          const now = new Date().toISOString();

          function raw(v) {
            if (v === undefined || v === null || v === "") return null;
            if (typeof v === "number" && Number.isFinite(v)) return String(v);
            if (typeof v === "boolean") return v ? "1" : "0";
            return typeof v === "object" ? JSON.stringify(v) : String(v);
          }

          function sqlString(s) {
            return "'" + s.replace(/'/g, "''") + "'";
          }

          function val(v) {
            const s = raw(v);
            if (s === null) return "NULL";
            if (typeof v === "number" && Number.isFinite(v)) return s;
            if (typeof v === "boolean") return s;
            return sqlString(s);
          }

          let statements = [];
          let fileBytes = 0;
          let fileNo = 0;
          let statementCount = 0;
          let largeFields = 0;

          function flush(force = false) {
            if (!statements.length) return;
            if (!force && statements.length < MAX_ROWS &&
                fileBytes < MAX_FILE_BYTES) return;

            const filename = "/tmp/d1-import/chunk-" +
              String(++fileNo).padStart(5, "0") + ".sql";

            fs.writeFileSync(filename, statements.join("\n") + "\n");
            statements = [];
            fileBytes = 0;
          }

          function add(sql) {
            const bytes = Buffer.byteLength(sql, "utf8") + 1;

            if (bytes > 30000) {
              throw new Error("Unexpected oversized SQL statement: " + bytes);
            }

            if (statements.length &&
                (statements.length >= MAX_ROWS ||
                 fileBytes + bytes > MAX_FILE_BYTES)) {
              flush(true);
            }

            statements.push(sql);
            fileBytes += bytes;
            statementCount++;
          }

          for (const x of items) {
            const detail = x.detail_url ||
              (x.kind && x.slug
                ? "https://ctgmovies.com/" + x.kind + "/" + x.slug
                : null);

            const values = [
              x.id,x.kind,x.slug,x.name,x.poster,x.backdrop,x.year,
              x.overview,x.rating,x.genres,x.runtime,x.imdb,x.tmdb,
              x.trailer,x.episodes,detail,x.links,now
            ];

            const stored = [];
            const updates = [];

            for (let i = 0; i < cols.length; i++) {
              const original = values[i];
              const s = raw(original);

              if (s !== null &&
                  typeof original !== "number" &&
                  typeof original !== "boolean" &&
                  s.length > MAX_FIELD_CHARS) {
                stored.push("NULL");
                largeFields++;

                for (let pos = 0; pos < s.length; pos += 6000) {
                  const piece = s.slice(pos, pos + 6000);
                  updates.push(
                    "UPDATE movies SET " + cols[i] +
                    " = COALESCE(" + cols[i] + ",'') || " +
                    sqlString(piece) +
                    " WHERE id = " + val(x.id) + ";"
                  );
                }
              } else {
                stored.push(val(original));
              }
            }

            add(
              "INSERT OR REPLACE INTO movies (" + cols.join(",") +
              ") VALUES (" + stored.join(",") + ");"
            );

            for (const statement of updates) add(statement);
          }

          flush(true);

          console.log("Catalog records:", items.length);
          console.log("SQL files:", fileNo);
          console.log("SQL statements:", statementCount);
          console.log("Large fields split into chunks:", largeFields);
          NODE
