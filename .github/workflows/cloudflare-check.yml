        run: |
          set -e
          curl --fail --show-error --silent \
            --max-time 20 \
            https://ctgmovies-api.proshantobarua70-4a5.workers.dev/ping

      - name: Check Database
        run: |
          set -e
          curl --fail --show-error --silent \
            --max-time 20 \
            https://ctgmovies-api.proshantobarua70-4a5.workers.dev/db
          echo ""
          echo "Cloudflare connection check completed."
